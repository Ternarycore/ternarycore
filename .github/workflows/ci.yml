name: CI - TernaryCore Verification

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  verify-simulation:
    name: RTL and reference simulation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog
        python -m pip install --upgrade pip numpy

    - name: Run Icarus regressions and Python references
      working-directory: sim
      run: |
        make extended
        make verify

  lint-verilog:
    name: Strict Verilog lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator

    - name: Lint shipped RTL tops
      run: |
        set -euo pipefail
        LINT_FLAGS=(
          --lint-only -Wall
          -Wno-DECLFILENAME
          -Wno-UNOPTFLAT
          -Wno-WIDTHEXPAND
          -Wno-WIDTHTRUNC
          -Wno-TIMESCALEMOD
          -Wno-PINMISSING
          -Wno-BLKSEQ
          -Wno-UNUSEDPARAM
          -Wno-UNUSEDSIGNAL
        )

        verilator "${LINT_FLAGS[@]}" --top-module ternary_pipeline \
          rtl/activation_quant.v rtl/ternary_weight.v rtl/ternary_dot.v \
          rtl/ternary_gemm.v rtl/ternary_scale.v rtl/ternary_pipeline.v
        verilator "${LINT_FLAGS[@]}" --top-module axi_gemm_wrapper \
          rtl/ternary_weight.v rtl/ternary_dot.v rtl/ternary_gemm.v \
          rtl/axi_gemm_wrapper.v
        verilator "${LINT_FLAGS[@]}" --top-module weight_bram \
          rtl/weight_bram.v
        verilator "${LINT_FLAGS[@]}" --top-module fp8_to_q15 \
          rtl/fp8_to_q15.v

  verilator-sim:
    name: Full pipeline simulation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator build-essential

    - name: Run all shipped Verilator tests
      working-directory: sim
      run: make verilator-all

  formal-verification:
    name: Formal verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install OSS CAD Suite
      run: |
        curl -L https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2024-08-28/oss-cad-suite-linux-x64-20240828.tgz \
          | tar -xz -C "$HOME"
        echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

    - name: Run every configured proof
      run: bash formal/run_all.sh

    - name: Upload formal logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: formal-logs
        path: /tmp/ternarycore-sby
        if-no-files-found: ignore

  check-documentation:
    name: Repository documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check required project files
      run: |
        set -euo pipefail
        required_files=(README.md AGENTS.md DEBUGGING.md .gitignore .gitattributes sim/Makefile)
        for required_file in "${required_files[@]}"; do
          test -f "$required_file" || {
            echo "Missing required file: $required_file" >&2
            exit 1
          }
        done

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs:
      - verify-simulation
      - lint-verilog
      - verilator-sim
      - formal-verification
      - check-documentation

    steps:
    - name: Record success
      run: |
        echo "All required simulation, lint, formal, and documentation checks passed."
        echo "## Verification complete" >> "$GITHUB_STEP_SUMMARY"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
