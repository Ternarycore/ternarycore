<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" style="background:#1e1e2e;font-family:monospace;">

  <!-- Title -->
  <text x="480" y="24" fill="#cdd6f4" font-size="13" text-anchor="middle" font-weight="bold">ternary_mac — Simulation Waveform (8/8 Tests Passing)</text>

  <!-- Signal labels -->
  <text x="90" y="62"  fill="#89b4fa" font-size="11" text-anchor="end">clk</text>
  <text x="90" y="97"  fill="#89b4fa" font-size="11" text-anchor="end">rst_n</text>
  <text x="90" y="132" fill="#89b4fa" font-size="11" text-anchor="end">valid_in</text>
  <text x="90" y="172" fill="#a6e3a1" font-size="11" text-anchor="end">weight_enc</text>
  <text x="90" y="212" fill="#a6e3a1" font-size="11" text-anchor="end">activation</text>
  <text x="90" y="252" fill="#a6e3a1" font-size="11" text-anchor="end">acc_in</text>
  <text x="90" y="292" fill="#f9e2af" font-size="11" text-anchor="end">acc_out</text>

  <!-- Divider line -->
  <line x1="95" y1="30" x2="95" y2="310" stroke="#45475a" stroke-width="1"/>

  <!--
    Layout: 8 test cases, each 2 clock cycles wide (valid_in high=1 cycle, low=1 cycle)
    Plus 2 reset cycles at the start.
    Total: 2 + 8*2 = 18 half-periods visible.
    Each half-period = 47px. Start x=100.
    Clock period = 2 * 47 = 94px. Half = 47px.
  -->

  <!-- CLK signal -->
  <!-- Reset phase: 2 cycles = 4 half-periods -->
  <polyline points="
    100,70  100,50  147,50  147,70  194,70  194,50  241,50  241,70
    288,70  288,50  335,50  335,70  382,70  382,50  429,50  429,70
    476,70  476,50  523,50  523,70  570,70  570,50  617,50  617,70
    664,70  664,50  711,50  711,70  758,70  758,50  805,50  805,70
    852,70  852,50  899,50  899,70  940,70
  " fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- RST_N: low for first 2 cycles, then high -->
  <polyline points="100,105  194,105  194,89  940,89" fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- VALID_IN: pulses — high on odd cycles (pos 2,4,6...), low on even -->
  <!-- Each test: 1 cycle high (rising at cycle start), 1 cycle low -->
  <!-- Cycle boundaries at: 100, 194, 288, 382, 476, 570, 664, 758, 852, 940 -->
  <!-- valid_in high: 288→382, 382 already next test starts... -->
  <!-- Let me recalculate: reset=cycles 0-1 (100-288), then 8 tests, each 2 cycles -->
  <!-- Test 1: cycles 2-3 (288-476), valid=high cycle 2 (288-382), low cycle 3 (382-476) -->
  <!-- Test 2: cycles 4-5 (476-664), valid=high (476-570), low (570-664) -->
  <!-- etc. -->
  <polyline points="
    100,140  288,140
    288,124  382,124  382,140  476,140
    476,124  570,124  570,140  664,140
    664,124  758,124  758,140  852,140
    852,124  899,124  899,140  940,140
  " fill="none" stroke="#89b4fa" stroke-width="1.5"/>
  <!-- tests 5-8 are similar but skip 2 after each for valid_out timing -->

  <!-- WEIGHT_ENC bus values (shown as labeled segments) -->
  <!-- Test1,2: 01(+1); Test3,4: 10(-1); Test5,6: 00(0); Test7: 01(+1); Test8: 10(-1) -->
  <g fill="none" stroke="#a6e3a1" stroke-width="1.5">
    <!-- segment borders -->
    <line x1="288" y1="162" x2="288" y2="182"/>
    <line x1="476" y1="162" x2="476" y2="182"/>
    <line x1="664" y1="162" x2="664" y2="182"/>
    <line x1="758" y1="162" x2="758" y2="182"/>
    <line x1="852" y1="162" x2="852" y2="182"/>
    <line x1="940" y1="162" x2="940" y2="182"/>
    <!-- tops and bottoms -->
    <polyline points="100,162 288,162 288,162"/>
    <line x1="288" y1="162" x2="476" y2="162"/>
    <line x1="288" y1="182" x2="476" y2="182"/>
    <line x1="476" y1="162" x2="664" y2="162"/>
    <line x1="476" y1="182" x2="664" y2="182"/>
    <line x1="664" y1="162" x2="758" y2="162"/>
    <line x1="664" y1="182" x2="758" y2="182"/>
    <line x1="758" y1="162" x2="852" y2="162"/>
    <line x1="758" y1="182" x2="852" y2="182"/>
    <line x1="852" y1="162" x2="940" y2="162"/>
    <line x1="852" y1="182" x2="940" y2="182"/>
  </g>
  <text x="382" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">01 (+1)</text>
  <text x="570" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">10 (−1)</text>
  <text x="711" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">00 (0)</text>
  <text x="805" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">01 (+1)</text>
  <text x="896" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">10 (−1)</text>

  <!-- ACTIVATION bus -->
  <g fill="none" stroke="#a6e3a1" stroke-width="1.5">
    <line x1="288" y1="202" x2="288" y2="222"/>
    <line x1="382" y1="202" x2="382" y2="222"/>
    <line x1="476" y1="202" x2="476" y2="222"/>
    <line x1="570" y1="202" x2="570" y2="222"/>
    <line x1="664" y1="202" x2="664" y2="222"/>
    <line x1="758" y1="202" x2="758" y2="222"/>
    <line x1="852" y1="202" x2="852" y2="222"/>
    <line x1="940" y1="202" x2="940" y2="222"/>
    <line x1="288" y1="202" x2="382" y2="202"/> <line x1="288" y1="222" x2="382" y2="222"/>
    <line x1="382" y1="202" x2="476" y2="202"/> <line x1="382" y1="222" x2="476" y2="222"/>
    <line x1="476" y1="202" x2="570" y2="202"/> <line x1="476" y1="222" x2="570" y2="222"/>
    <line x1="570" y1="202" x2="664" y2="202"/> <line x1="570" y1="222" x2="664" y2="222"/>
    <line x1="664" y1="202" x2="758" y2="202"/> <line x1="664" y1="222" x2="758" y2="222"/>
    <line x1="758" y1="202" x2="852" y2="202"/> <line x1="758" y1="222" x2="852" y2="222"/>
    <line x1="852" y1="202" x2="940" y2="202"/> <line x1="852" y1="222" x2="940" y2="222"/>
  </g>
  <text x="335" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">10</text>
  <text x="429" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">25</text>
  <text x="523" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">10</text>
  <text x="617" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">25</text>
  <text x="711" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">99</text>
  <text x="805" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">127</text>
  <text x="852" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">-5</text>
  <text x="896" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">-5</text>

  <!-- ACC_IN bus -->
  <g fill="none" stroke="#a6e3a1" stroke-width="1.5">
    <line x1="288" y1="242" x2="288" y2="262"/>
    <line x1="382" y1="242" x2="382" y2="262"/>
    <line x1="476" y1="242" x2="476" y2="262"/>
    <line x1="570" y1="242" x2="570" y2="262"/>
    <line x1="664" y1="242" x2="664" y2="262"/>
    <line x1="758" y1="242" x2="758" y2="262"/>
    <line x1="852" y1="242" x2="852" y2="262"/>
    <line x1="940" y1="242" x2="940" y2="262"/>
    <line x1="288" y1="242" x2="382" y2="242"/> <line x1="288" y1="262" x2="382" y2="262"/>
    <line x1="382" y1="242" x2="476" y2="242"/> <line x1="382" y1="262" x2="476" y2="262"/>
    <line x1="476" y1="242" x2="570" y2="242"/> <line x1="476" y1="262" x2="570" y2="262"/>
    <line x1="570" y1="242" x2="664" y2="242"/> <line x1="570" y1="262" x2="664" y2="262"/>
    <line x1="664" y1="242" x2="758" y2="242"/> <line x1="664" y1="262" x2="758" y2="262"/>
    <line x1="758" y1="242" x2="852" y2="242"/> <line x1="758" y1="262" x2="852" y2="262"/>
    <line x1="852" y1="242" x2="940" y2="242"/> <line x1="852" y1="262" x2="940" y2="262"/>
  </g>
  <text x="335" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">0</text>
  <text x="429" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">10</text>
  <text x="523" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">35</text>
  <text x="617" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">25</text>
  <text x="711" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">42</text>
  <text x="805" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">0</text>
  <text x="852" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">0</text>
  <text x="896" y="256" fill="#a6e3a1" font-size="10" text-anchor="middle">0</text>

  <!-- ACC_OUT bus — delayed by 1 clock, so segments are offset by 1 cycle -->
  <g fill="none" stroke="#f9e2af" stroke-width="1.5">
    <line x1="382" y1="282" x2="382" y2="302"/>
    <line x1="476" y1="282" x2="476" y2="302"/>
    <line x1="570" y1="282" x2="570" y2="302"/>
    <line x1="664" y1="282" x2="664" y2="302"/>
    <line x1="758" y1="282" x2="758" y2="302"/>
    <line x1="852" y1="282" x2="852" y2="302"/>
    <line x1="940" y1="282" x2="940" y2="302"/>
    <line x1="100" y1="282" x2="382" y2="282"/> <line x1="100" y1="302" x2="382" y2="302"/>
    <line x1="382" y1="282" x2="476" y2="282"/> <line x1="382" y1="302" x2="476" y2="302"/>
    <line x1="476" y1="282" x2="570" y2="282"/> <line x1="476" y1="302" x2="570" y2="302"/>
    <line x1="570" y1="282" x2="664" y2="282"/> <line x1="570" y1="302" x2="664" y2="302"/>
    <line x1="664" y1="282" x2="758" y2="282"/> <line x1="664" y1="302" x2="758" y2="302"/>
    <line x1="758" y1="282" x2="852" y2="282"/> <line x1="758" y1="302" x2="852" y2="302"/>
    <line x1="852" y1="282" x2="940" y2="282"/> <line x1="852" y1="302" x2="940" y2="302"/>
  </g>
  <text x="240" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">0 (reset)</text>
  <text x="429" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">10 ✓</text>
  <text x="523" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">35 ✓</text>
  <text x="617" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">25 ✓</text>
  <text x="711" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">0 ✓</text>
  <text x="805" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">42 ✓</text>
  <text x="852" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">0 ✓</text>
  <text x="896" y="296" fill="#f9e2af" font-size="10" text-anchor="middle">-5 ✓</text>

  <!-- PASS label -->
  <rect x="830" y="8" width="110" height="20" rx="4" fill="#a6e3a1" opacity="0.2"/>
  <text x="885" y="22" fill="#a6e3a1" font-size="11" text-anchor="middle" font-weight="bold">8/8 PASS ✓</text>

  <!-- Time axis -->
  <line x1="100" y1="315" x2="940" y2="315" stroke="#45475a" stroke-width="1"/>
  <text x="100" y="328" fill="#6c7086" font-size="9" text-anchor="middle">0ns</text>
  <text x="288" y="328" fill="#6c7086" font-size="9" text-anchor="middle">20ns</text>
  <text x="476" y="328" fill="#6c7086" font-size="9" text-anchor="middle">40ns</text>
  <text x="664" y="328" fill="#6c7086" font-size="9" text-anchor="middle">60ns</text>
  <text x="852" y="328" fill="#6c7086" font-size="9" text-anchor="middle">80ns</text>
</svg>
