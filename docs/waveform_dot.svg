<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" style="font-family:monospace;">
  <rect width="960" height="350" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="480" y="24" fill="#cdd6f4" font-size="13" text-anchor="middle" font-weight="bold">ternary_dot — Simulation Waveform (7/7 Tests Passing, VLEN=8)</text>

  <!-- Signal labels -->
  <text x="90" y="62"  fill="#89b4fa" font-size="11" text-anchor="end">clk</text>
  <text x="90" y="97"  fill="#89b4fa" font-size="11" text-anchor="end">rst_n</text>
  <text x="90" y="132" fill="#89b4fa" font-size="11" text-anchor="end">valid_in</text>
  <text x="90" y="172" fill="#a6e3a1" font-size="11" text-anchor="end">activation</text>
  <text x="90" y="212" fill="#a6e3a1" font-size="11" text-anchor="end">weight_enc</text>
  <text x="90" y="255" fill="#f9e2af" font-size="11" text-anchor="end">acc_out</text>
  <text x="90" y="295" fill="#89b4fa" font-size="11" text-anchor="end">valid_out</text>

  <!-- Divider line -->
  <line x1="95" y1="30" x2="95" y2="315" stroke="#45475a" stroke-width="1"/>

  <!--
    Layout: 2 reset cycles + 8 data cycles + 1 result cycle = 11 cycles
    Each cycle = 76px. Start x=100, end x=100+11*76=936~940.
    Clock half-period = 38px.
    C[i] = 100 + 76*i
    C0=100, C1=176, C2=252, C3=328, C4=404, C5=480, C6=556,
    C7=632, C8=708, C9=784, C10=860, END=940
    Time: each cycle = 10ns
  -->

  <!-- CLK -->
  <polyline points="
    100,70 100,50 138,50 138,70 176,70
    176,50 214,50 214,70 252,70
    252,50 290,50 290,70 328,70
    328,50 366,50 366,70 404,70
    404,50 442,50 442,70 480,70
    480,50 518,50 518,70 556,70
    556,50 594,50 594,70 632,70
    632,50 670,50 670,70 708,70
    708,50 746,50 746,70 784,70
    784,50 822,50 822,70 860,70
    860,50 898,50 898,70 940,70
  " fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- RST_N: low for first cycle (100-176), then high -->
  <polyline points="100,105 176,105 176,88 940,88" fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- VALID_IN: high C2(252) to C9(784), low otherwise -->
  <polyline points="
    100,140 252,140
    252,122 784,122
    784,140 940,140
  " fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- ACTIVATION bus: 00 during reset, then 01..08 each cycle -->
  <!-- Boundaries at C2..C10 -->
  <g fill="none" stroke="#a6e3a1" stroke-width="1.5">
    <line x1="252" y1="162" x2="252" y2="182"/>
    <line x1="328" y1="162" x2="328" y2="182"/>
    <line x1="404" y1="162" x2="404" y2="182"/>
    <line x1="480" y1="162" x2="480" y2="182"/>
    <line x1="556" y1="162" x2="556" y2="182"/>
    <line x1="632" y1="162" x2="632" y2="182"/>
    <line x1="708" y1="162" x2="708" y2="182"/>
    <line x1="784" y1="162" x2="784" y2="182"/>
    <line x1="100" y1="162" x2="252" y2="162"/> <line x1="100" y1="182" x2="252" y2="182"/>
    <line x1="252" y1="162" x2="328" y2="162"/> <line x1="252" y1="182" x2="328" y2="182"/>
    <line x1="328" y1="162" x2="404" y2="162"/> <line x1="328" y1="182" x2="404" y2="182"/>
    <line x1="404" y1="162" x2="480" y2="162"/> <line x1="404" y1="182" x2="480" y2="182"/>
    <line x1="480" y1="162" x2="556" y2="162"/> <line x1="480" y1="182" x2="556" y2="182"/>
    <line x1="556" y1="162" x2="632" y2="162"/> <line x1="556" y1="182" x2="632" y2="182"/>
    <line x1="632" y1="162" x2="708" y2="162"/> <line x1="632" y1="182" x2="708" y2="182"/>
    <line x1="708" y1="162" x2="784" y2="162"/> <line x1="708" y1="182" x2="784" y2="182"/>
    <line x1="784" y1="162" x2="940" y2="162"/> <line x1="784" y1="182" x2="940" y2="182"/>
  </g>
  <text x="176" y="176" fill="#a6e3a1" font-size="9" text-anchor="middle">00</text>
  <text x="290" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">01</text>
  <text x="366" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">02</text>
  <text x="442" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">03</text>
  <text x="518" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">04</text>
  <text x="594" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">05</text>
  <text x="670" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">06</text>
  <text x="746" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">07</text>
  <text x="862" y="176" fill="#a6e3a1" font-size="10" text-anchor="middle">08</text>

  <!-- WEIGHT_ENC bus: 0 during reset, 1 (+1) for all 8 elements -->
  <g fill="none" stroke="#a6e3a1" stroke-width="1.5">
    <line x1="252" y1="202" x2="252" y2="222"/>
    <line x1="100" y1="202" x2="252" y2="202"/> <line x1="100" y1="222" x2="252" y2="222"/>
    <line x1="252" y1="202" x2="940" y2="202"/> <line x1="252" y1="222" x2="940" y2="222"/>
  </g>
  <text x="176" y="216" fill="#a6e3a1" font-size="9" text-anchor="middle">0</text>
  <text x="596" y="216" fill="#a6e3a1" font-size="10" text-anchor="middle">1  (+1, all elements)</text>

  <!-- ACC_OUT bus (yellow): 00000000 until C10(860), then 36 -->
  <g fill="none" stroke="#f9e2af" stroke-width="1.5">
    <line x1="860" y1="242" x2="860" y2="268"/>
    <line x1="100" y1="242" x2="860" y2="242"/> <line x1="100" y1="268" x2="860" y2="268"/>
    <line x1="860" y1="242" x2="940" y2="242"/> <line x1="860" y1="268" x2="940" y2="268"/>
  </g>
  <text x="480" y="260" fill="#f9e2af" font-size="10" text-anchor="middle">00000000  (accumulating internally)</text>
  <text x="900" y="260" fill="#f9e2af" font-size="10" text-anchor="middle">36 ✓</text>

  <!-- VALID_OUT: pulses high at C10(860), stays high through end of view -->
  <polyline points="
    100,303 860,303
    860,283 940,283
  " fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Annotation arrow: "8 elements stream in" -->
  <line x1="252" y1="315" x2="784" y2="315" stroke="#6c7086" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="518" y="328" fill="#6c7086" font-size="9" text-anchor="middle">← 8 elements, 1 per clock →</text>

  <!-- Annotation: result -->
  <line x1="860" y1="230" x2="860" y2="308" stroke="#f9e2af" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="900" y="232" fill="#f9e2af" font-size="8" text-anchor="middle">result</text>

  <!-- PASS badge -->
  <rect x="830" y="8" width="110" height="20" rx="4" fill="#a6e3a1" opacity="0.2"/>
  <text x="885" y="22" fill="#a6e3a1" font-size="11" text-anchor="middle" font-weight="bold">7/7 PASS ✓</text>

  <!-- Time axis -->
  <line x1="100" y1="338" x2="940" y2="338" stroke="#45475a" stroke-width="1"/>
  <text x="100"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">0ns</text>
  <text x="252"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">20ns</text>
  <text x="404"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">40ns</text>
  <text x="556"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">60ns</text>
  <text x="708"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">80ns</text>
  <text x="860"  y="348" fill="#6c7086" font-size="9" text-anchor="middle">100ns</text>

</svg>
